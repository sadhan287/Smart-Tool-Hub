
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tool Hub</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5ff;
 color:#172554;
}

header{
 background:linear-gradient(135deg,#0755d9,#173b91);
 color:white;
 padding:22px 15px;
 text-align:center;
}

.logo{
 font-size:32px;
 font-weight:bold;
}

header p{margin-bottom:0}

.container{
 max-width:650px;
 margin:25px auto;
 padding:15px;
}

.card{
 background:white;
 padding:22px;
 border-radius:16px;
 box-shadow:0 4px 18px #00000012;
}

h2{text-align:center;color:#1246a0}

textarea{
 width:100%;
 height:180px;
 padding:14px;
 border:2px solid #cbd5e1;
 border-radius:10px;
 font-size:16px;
 resize:vertical;
}

select{
 width:100%;
 padding:12px;
 margin:12px 0;
 border:1px solid #cbd5e1;
 border-radius:8px;
 font-size:15px;
}

.buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}

button{
 border:0;
 border-radius:9px;
 padding:14px 8px;
 background:#1455d9;
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#083b9e}

.secondary{background:#475569}

#result{
 background:#eff6ff;
 padding:15px;
 margin-top:18px;
 border-radius:10px;
 min-height:60px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

footer{
 text-align:center;
 padding:25px;
 color:#64748b;
}
</style>
</head>

<body>

<header>
 <div class="logo">🚀 Smart Tool Hub</div>
 <p id="tagline">Your Free Online Smart Tools</p>
</header>

<div class="container">

<div class="card">

<h2 id="heading">Smart Text Tool</h2>

<select id="language" onchange="changeLanguage()">
 <option value="en">English</option>
 <option value="hi">हिन्दी</option>
</select>

<textarea id="input" placeholder="Enter your text here..."></textarea>

<p id="count">Characters: 0</p>

<div class="buttons">

<button onclick="summarize()" id="sum">
 Summarize
</button>

<button onclick="improve()" id="imp">
 Improve Writing
</button>

<button onclick="translateText()" id="trans">
 Translate
</button>

<button onclick="copyResult()" id="copy">
 Copy Text
</button>

</div>

<div id="result">Your result will appear here...</div>

</div>

</div>

<footer>
© 2026 Smart Tool Hub | Free Online Tools
</footer>

<script>

const input=document.getElementById("input");
const result=document.getElementById("result");

input.addEventListener("input",()=>{
 document.getElementById("count").textContent=
 "Characters: "+input.value.length;
});

function summarize(){
 let text=input.value.trim();
 if(!text){alert("Please enter some text");return;}

 let sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];
 result.textContent=sentences.slice(0,3).join(" ").trim();
}

function improve(){
 let text=input.value.trim();
 if(!text){alert("Please enter some text");return;}

 text=text.replace(/\s+/g," ");
 text=text.charAt(0).toUpperCase()+text.slice(1);

 result.textContent=text;
}

function translateText(){
 let text=input.value.trim();
 if(!text){alert("Please enter some text");return;}

 let url="https://translate.google.com/?sl=auto&tl=hi&text="
 +encodeURIComponent(text)+"&op=translate";

 window.open(url,"_blank");
}

function copyResult(){
 let text=result.textContent;
 if(!text){return;}
 navigator.clipboard.writeText(text)
 .then(()=>alert("Copied successfully!"))
 .catch(()=>alert("Please select and copy the text."));
}

function changeLanguage(){
 let lang=document.getElementById("language").value;

 if(lang==="hi"){
  document.getElementById("tagline").textContent=
  "आपके लिए मुफ्त ऑनलाइन स्मार्ट टूल्स";
  document.getElementById("heading").textContent="स्मार्ट टेक्स्ट टूल";
  document.getElementById("sum").textContent="सारांश बनाएं";
  document.getElementById("imp").textContent="लेखन सुधारें";
  document.getElementById("trans").textContent="अनुवाद करें";
  document.getElementById("copy").textContent="कॉपी करें";
  input.placeholder="यहाँ अपना टेक्स्ट लिखें...";
  result.textContent="आपका परिणाम यहाँ दिखाई देगा...";
 }else{
  document.getElementById("tagline").textContent=
  "Your Free Online Smart Tools";
  document.getElementById("heading").textContent="Smart Text Tool";
  document.getElementById("sum").textContent="Summarize";
  document.getElementById("imp").textContent="Improve Writing";
  document.getElementById("trans").textContent="Translate";
  document.getElementById("copy").textContent="Copy Text";
  input.placeholder="Enter your text here...";
  result.textContent="Your result will appear here...";
 }
}

</script>

</body>
</html>
